<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Houssein Student</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f5ff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    header {
      background: #1565c0;
      color: white;
      padding: 20px;
      border-radius: 12px;
    }
    .card {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
    }
    button {
      background: #1565c0;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎓 Houssein Student</h1>
    <p>Bienvenue sur notre application scolaire !</p>
  </header>

  <div class="card">
    <h2>📚 Cours</h2>
    <p>Retrouvez vos cours scolaires ici.</p>
    <button onclick="alert('Les cours arrivent bientôt !')">
      Voir les cours
    </button>
  </div>

  <div class="card">
    <h2>📝 Exercices</h2>
    <p>Entraînez-vous avec vos exercices.</p>
    <button onclick="alert('Les exercices arrivent bientôt !')">
      Voir les exercices
    </button>
  </div>

  <div class="card">
    <h2>📢 Annonces</h2>
    <p>Les informations importantes pour les élèves.</p>
  </div>
</body>
</html>
